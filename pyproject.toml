[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ncm-restore-local"
version = "0.4.1"
description = "Restore or locally convert audio from NCM files"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "customtkinter>=6,<7",
    "cryptography>=42,<47",
    "tkinterdnd2>=0.6,<0.7",
]
license = "MIT"

[project.scripts]
ncm-restore = "ncm_restore.cli:main"
ncm-restore-gui = "ncm_restore.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
