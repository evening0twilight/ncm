[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ncm-restore-local"
version = "0.2.0"
description = "Restore or locally convert audio from NCM files"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cryptography>=42,<47"]
license = {text = "MIT"}

[project.scripts]
ncm-restore = "ncm_restore.cli:main"
ncm-restore-gui = "ncm_restore.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
